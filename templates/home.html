{% extends "base.html" %}
{% block title %}Word Scramble - Home{% endblock %}

{% block content %}
<div x-data="startMenu()" x-init="playSfx('gameStart')" class="flex flex-col items-center pt-12">
    <img src="{{ url_for('static', filename='images/creature.svg') }}"
         alt="Game mascot" class="w-36 h-36 mb-4 animate-drop-in">
    <h1 class="text-5xl md:text-6xl font-bold text-center mb-4 text-white animate-drop-in-delayed">
        Word Scramble
    </h1>
    <p class="text-xl text-[var(--text-muted)] mb-12">Unscramble the letters to find the word!</p>

    <div class="game-card p-8 md:p-12 w-full max-w-md text-center">
        <p class="text-lg text-[var(--glow-blue)] mb-6 font-semibold">How many words?</p>

        <div class="flex flex-col gap-4">
            <template x-for="size in sizes" :key="size">
                <button
                    @click="start(size)"
                    :disabled="loading"
                    class="btn-glow py-4 px-8 rounded-2xl text-2xl font-bold text-white transition-all disabled:opacity-50"
                    :class="{
                        'bg-[var(--tile-green)]': size === 5,
                        'bg-[var(--glow-blue)]': size === 10,
                        'bg-[var(--tile-orange)]': size === 15
                    }"
                    x-text="size + ' Words'"
                ></button>
            </template>
        </div>

        <p x-show="error" x-cloak class="text-[var(--tile-orange)] mt-6" x-text="error"></p>
    </div>

    <a href="{{ url_for('pages.history') }}" class="mt-8 text-[var(--text-accent)] hover:underline text-lg">
        See My Scores
    </a>
</div>

<script src="{{ url_for('static', filename='js/start-round.js') }}"></script>
<script>
    function startMenu() {
        return {
            ...roundStarter(),
            sizes: {{ config.ROUND_SIZES | list | tojson }},
        };
    }
</script>
{% endblock %}
